flutter_launcher_icons:
  # Android – classic icon + adaptive (API 26+)
  android: "launcher_icon"
  min_sdk_android: 21
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#58CC02"          # brand green – matches icon bg
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"  # pole + flag + 1 on transparent

  # iOS – plain square, no transparency allowed
  ios: true
  image_path_ios: "assets/icon/app_icon.png"
